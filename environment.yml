name: haiku
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # ---- PyTorch (CUDA 12.4 build; adjust to match your driver) ----
      - torch==2.6.0
      - torchvision==0.21.0

      # ---- HuggingFace stack ----
      - transformers==4.45.0
      - huggingface_hub>=0.29.0
      - tokenizers>=0.20.0
      - safetensors
      - timm==1.0.19

      # ---- VirTues mIF encoder backend (memory-efficient attention) ----
      - xformers==0.0.29.post3
      - loguru

      # ---- MUSK transitive dep (BEiT3 / torchscale) ----
      - fairscale

      # ---- Math / data / plotting ----
      - numpy
      - pandas
      - matplotlib
      - h5py
      - einops
      - tqdm
      - scikit-learn

      # ---- Jupyter for running the example notebooks ----
      - ipykernel
      - jupyter
      - nbconvert

      # ---- Optional config utilities (used by training-only paths) ----
      - omegaconf
      - hydra-core

      # ---- MUSK H&E encoder (installed straight from GitHub) ----
      - musk @ git+https://github.com/lilab-stanford/MUSK.git
